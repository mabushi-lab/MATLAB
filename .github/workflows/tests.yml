name: Run MATLAB tests

# Runs the matlab.unittest suite in tests/ automatically on every push and
# pull request, using MathWorks' own GitHub Actions.
#
# LICENSE NOTE: MathWorks provides matlab-actions (setup-matlab / run-tests)
# free of charge for PUBLIC GitHub repositories — a temporary MATLAB batch
# license is applied automatically, no license file or MATLAB account setup
# needed on your end. If this repo is PRIVATE, this workflow will fail at
# the "Set up MATLAB" step, because private repos aren't covered by that
# free batch license. To use CI on a private repo you'd need either:
#   (a) a self-hosted runner that already has MATLAB installed, or
#   (b) your own MATLAB license configured for CI use (see MathWorks'
#       matlab-actions documentation for "Use a manually licensed MATLAB").
# Neither is set up here — this workflow targets the common "public repo,
# free CI" case, which is the one most personal/learning projects like this
# one actually use.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lets you also trigger a run manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run tests (toolbox on the path, tests/ discovered for results + JUnit report)
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: toolbox
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Upload test results
        if: always()   # keep the report even when tests fail, so you can inspect it
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/results.xml
